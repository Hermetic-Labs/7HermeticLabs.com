<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">HermetiQ quantum state visualization</title>
  <desc id="desc">A luminous Bloch sphere with orbiting qubit states and a connected three-node register.</desc>
  <defs>
    <radialGradient id="sphere" cx="46%" cy="40%" r="58%">
      <stop offset="0" stop-color="#17375f" stop-opacity=".9"/>
      <stop offset=".58" stop-color="#07121f" stop-opacity=".84"/>
      <stop offset="1" stop-color="#020609" stop-opacity=".25"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8abfff"/>
      <stop offset=".5" stop-color="#2fb4a5"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(184 150)">
    <circle r="102" fill="url(#sphere)" stroke="#6ba9ff" stroke-opacity=".42" stroke-width="2"/>
    <ellipse rx="102" ry="34" fill="none" stroke="#6ba9ff" stroke-opacity=".38"/>
    <ellipse rx="34" ry="102" fill="none" stroke="#2fb4a5" stroke-opacity=".34"/>
    <ellipse rx="102" ry="34" transform="rotate(-36)" fill="none" stroke="url(#orbit)" stroke-width="2" stroke-opacity=".82"/>
    <path d="M-102 0h204M0-102v204" stroke="#d8eaff" stroke-opacity=".17"/>
    <path d="M0 0L62-74" stroke="#f3f8ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="62" cy="-74" r="8" fill="#8abfff" filter="url(#glow)"/>
    <circle r="6" fill="#f4f7ff" filter="url(#glow)"/>
  </g>
  <g transform="translate(346 77)">
    <path d="M0 72h72M72 72l72 64M72 72l72-64" fill="none" stroke="url(#orbit)" stroke-width="3" stroke-opacity=".72"/>
    <g fill="#07121f" stroke-width="3">
      <circle cx="0" cy="72" r="19" stroke="#8abfff"/>
      <circle cx="72" cy="72" r="19" stroke="#2fb4a5"/>
      <circle cx="144" cy="8" r="19" stroke="#d8b4fe"/>
      <circle cx="144" cy="136" r="19" stroke="#6ba9ff"/>
    </g>
    <g fill="#f6f9ff" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      <text x="0" y="76">q₀</text><text x="72" y="76">q₁</text><text x="144" y="12">q₂</text><text x="144" y="140">q₃</text>
    </g>
  </g>
</svg>
